name: StepUp • Apply Update

on:
  push:
    paths:
      - "STEPUP_UPDATE.zip"

permissions:
  contents: write

jobs:
  apply-stepup-update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout StepUp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify update package
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "STEPUP_UPDATE.zip" ]; then
            echo "STEPUP_UPDATE.zip was not found."
            exit 1
          fi

          unzip -t "STEPUP_UPDATE.zip"

      - name: Apply StepUp update
        shell: bash
        run: |
          set -euo pipefail

          WORK_DIR="$(mktemp -d)"
          EXTRACT_DIR="${WORK_DIR}/stepup-update"

          mkdir -p "${EXTRACT_DIR}"

          unzip -q "STEPUP_UPDATE.zip" -d "${EXTRACT_DIR}"

          shopt -s dotglob nullglob
          ITEMS=("${EXTRACT_DIR}"/*)

          # إذا كان داخل ZIP مجلد واحد فقط، ادخل داخله تلقائيا
          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE_DIR="${ITEMS[0]}"
          else
            SOURCE_DIR="${EXTRACT_DIR}"
          fi

          echo "Applying StepUp files from: ${SOURCE_DIR}"

          # تحديث الملفات الموجودة في الحزمة فقط
          # بدون حذف بقية ملفات StepUp
          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="STEPUP_UPDATE.zip" \
            "${SOURCE_DIR}/" "./"

          # حذف ملف التحديث بعد تطبيقه
          rm -f "STEPUP_UPDATE.zip"

      - name: Commit StepUp update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No StepUp changes detected."
            exit 0
          fi

          git commit -m "StepUp: apply packaged update"
          git push origin "HEAD:${GITHUB_REF_NAME}"
