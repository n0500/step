name: StepUp • Update & Deploy

on:
  push:
    paths:
      - "STEPUP_UPDATE.zip"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stepup-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout StepUp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply update
        shell: bash
        run: |
          set -euo pipefail

          test -f "STEPUP_UPDATE.zip"

          WORK_DIR="$(mktemp -d)"
          EXTRACT_DIR="${WORK_DIR}/update"
          mkdir -p "${EXTRACT_DIR}"

          unzip -q "STEPUP_UPDATE.zip" -d "${EXTRACT_DIR}"

          shopt -s dotglob nullglob
          ITEMS=("${EXTRACT_DIR}"/*)

          if [ "${#ITEMS[@]}" -eq 1 ] && [ -d "${ITEMS[0]}" ]; then
            SOURCE_DIR="${ITEMS[0]}"
          else
            SOURCE_DIR="${EXTRACT_DIR}"
          fi

          rsync -av \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="STEPUP_UPDATE.zip" \
            "${SOURCE_DIR}/" "./"

          rm -f "STEPUP_UPDATE.zip"

      - name: Save changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "StepUp: apply packaged update"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Prepare site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site

          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="_site/" \
            --exclude="STEPUP_UPDATE.zip" \
            ./ _site/

          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy StepUp
        id: deployment
        uses: actions/deploy-pages@v4
