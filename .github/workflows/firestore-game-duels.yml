name: STEP UP Friend Challenge Firestore Rules
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - 'tests/firestore-game-duels.test.cjs'
      - '.github/workflows/firestore-game-duels.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install Firebase emulator dependencies
        run: npm install --no-save --ignore-scripts firebase-tools@14 @firebase/rules-unit-testing@4 firebase@11
      - name: Compile rules and test friend competition access
        run: npx firebase emulators:exec --project demo-step-c44ef --only firestore "node --test tests/firestore-game-duels.test.cjs"
