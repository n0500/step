name: STEP UP Games Arcade Competition Checks
on:
  push:
    branches: [main]
    paths:
      - 'games-arcade.js'
      - 'game-duels.js'
      - 'game-duels.css'
      - 'games/grammar-rescue/game.js'
      - 'games/grammar-rescue/index.html'
      - 'tests/game-duels.test.cjs'
      - '.github/workflows/game-duels-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-games:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install test dependency
        run: npm install --no-save --ignore-scripts jsdom@26
      - name: Verify JavaScript syntax
        run: |
          node --check game-duels.js
          node --check games-arcade.js
          node --check games/grammar-rescue/game.js
      - name: Test student competition flows
        run: node --test tests/game-duels.test.cjs
