  <style id="stepup-name-first-styles">
    .stepup-first-entry{max-width:660px;margin:clamp(12px,5vh,38px) auto}
    .stepup-first-entry .stepup-first-hero{padding:clamp(20px,4vw,34px)}
    .stepup-first-entry .stepup-first-hero>h1{font-size:clamp(25px,5vw,34px);margin:9px 0 4px}
    .stepup-first-entry .stepup-first-hero>.hero-subtitle{margin-bottom:17px}
    .stepup-name-card{width:100%;box-sizing:border-box;padding:clamp(18px,4vw,26px);background:rgba(255,255,255,.98);color:#25364d;border:1px solid #e5e9f5;border-radius:19px;box-shadow:0 8px 24px rgba(20,47,81,.07);text-align:left}
    .stepup-name-card h2{font-size:clamp(21px,4vw,26px);line-height:1.3;margin:6px 0 7px;color:#25364d}
    .stepup-name-card p{color:#62718a;margin:0 0 19px;font-size:14px;line-height:1.6}
    .stepup-name-card .field label{color:#30415b;font-size:14px}
    .stepup-name-card .field input{font-size:16px;min-height:48px;border-radius:12px}
    .stepup-name-card .field input:focus{border-color:#7869df;box-shadow:0 0 0 3px rgba(115,95,218,.13)}
    .stepup-step-tag{display:inline-block;padding:5px 10px;border-radius:100px;background:#efedff;color:#5747b7;font:700 12px/1.4 Arial,Tahoma,sans-serif}
    .stepup-name-next,.stepup-login-submit{display:block;width:100%;margin-top:17px;min-height:47px;border-radius:12px!important;background:#6258d5!important;border:0!important;color:#fff!important;font-weight:700}
    .stepup-edit-name{border:0;background:transparent;color:#5146a9;margin-top:12px;font:700 13px/1.5 Arial,Tahoma,sans-serif;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
    .stepup-name-card [hidden]{display:none!important}
    .stepup-name-card .quick-entry-note{font-size:12px;line-height:1.65;color:#69778c}
    .stepup-first-entry .stepup-role-switch{padding:17px 0 2px;color:#fff;text-align:center;font-size:12px}
    .stepup-first-entry .stepup-role-switch>span{display:block;margin-bottom:8px}
    .stepup-first-entry #stepupRoleSelector{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}
    .stepup-first-entry #stepupRoleSelector .role-card{display:inline-flex;min-height:35px;min-width:80px;padding:7px 13px;border-radius:999px;align-items:center;justify-content:center;font:700 12px/1.3 Arial,Tahoma,sans-serif;flex:0 0 auto;color:#364766}
    .stepup-first-entry #stepupRoleSelector .role-card.active{border:1px solid #6258d5;background:#f4f1ff;color:#3d3479}
    .stepup-first-class{margin:18px auto}
    .stepup-first-class .student-entry-head{margin-bottom:16px}
    .stepup-first-class .student-entry-head h1{font-size:clamp(24px,5vw,32px)}
    .stepup-first-class .stepup-name-card{box-shadow:none}
    .stepup-staff-login .form-grid{margin-top:12px}
    @media(max-width:600px){
      .stepup-first-entry{margin:12px auto;padding:0 12px}
      .stepup-first-entry .stepup-first-hero{padding:18px}
      .stepup-first-class{margin:0 auto}
      .stepup-first-entry .stepup-role-switch{padding-top:12px}
      .stepup-first-entry #stepupRoleSelector .role-card{min-width:66px}
    }
  </style>
