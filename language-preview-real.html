<style>
/* Demo-specific additions only. All layout, colors, component classes and
   navigation use the live STEP UP stylesheets linked above. */
.preview-tag{display:inline-flex;align-items:center;justify-content:center;border:1px solid #a9cce0;color:#426d88;background:#eaf4fc;border-radius:999px;padding:5px 9px;font:700 10px/1.1 Arial,sans-serif;letter-spacing:.05em;white-space:nowrap}
.preview-language{display:inline-flex;align-items:center;padding:3px;background:#f5f7fb;border:1px solid #d8e2ef;border-radius:12px;gap:3px;flex-shrink:0}
.preview-language button{background:transparent;border:0;border-radius:9px;font-size:12px;font-weight:800;color:#66809a;padding:7px 9px;min-height:34px;cursor:pointer}
.preview-language button[aria-pressed="true"]{color:#145986;background:#fff;box-shadow:0 1px 5px #355b811b}
.preview-message{max-width:980px;margin:0 auto 16px;padding:10px 14px;border:1px dashed #b9d2e5;border-radius:12px;color:#527490;background:#f5faff;font-size:12px;line-height:1.6}
html.sx body.sx .demo-lesson{max-width:980px;margin:16px auto}
.demo-answers{display:grid;gap:9px;margin:14px 0;max-width:620px;direction:ltr;text-align:left}
.demo-answer{display:flex;gap:10px;align-items:center;border:1px solid #dbe5ef;background:#fff;border-radius:13px;padding:13px;cursor:pointer;text-align:left;color:#19344f;font-size:15px}
.demo-answer.selected{background:#edf7ff;border:2px solid #3c83c6;padding:12px}
.demo-answer input{accent-color:#1b69b5;width:17px;height:17px;flex-shrink:0}
.demo-feedback{border-radius:12px;background:#e7f7ef;border:1px solid #c5e7d5;padding:12px 14px;margin:10px 0;color:#285b49}
.demo-feedback.incorrect{background:#fff6e8;border-color:#f5debc;color:#75552c}
.demo-question{font-weight:750;font-size:20px;margin:14px 0;direction:ltr;text-align:left;color:#16324e}
.demo-actions{display:flex;gap:9px;flex-wrap:wrap}
.demo-settings{max-width:980px;margin:14px auto 0}
.demo-settings .preview-language{margin-top:10px}
.demo-profile-hint{font-size:11px;color:#8794a4;display:block;line-height:1.5;margin-top:5px}
.demo-static-eng{direction:ltr!important;text-align:left!important;unicode-bidi:isolate}
.demo-hidden{display:none!important}
html.sx body.sx .preview-message strong{color:#226080}
@media(max-width:680px){
  .preview-tag{display:none}
  .preview-language button{font-size:11px;padding:6px}
  header.appbar .brand small{display:none!important}
  header.appbar .nav-actions{gap:5px}
  .demo-question{font-size:18px}
  .preview-message{margin-left:14px;margin-right:14px}
}
</style>
</head>

 };

 function renderHeader(){
  $(".nav-actions").innerHTML='<span class="preview-tag">PREVIEW ONLY</span>'+languagePicker()+

 }

  $("#demoNav").innerHTML=navs.map(([id,k])=>'<button type="button" class="role-tab '+(id===screen?"active":"")+'" data-go="'+id+'" aria-current="'+(id===screen?"page":"false")+'"><span class="student-nav-icon">'+glyphs[id]+'</span><span class="student-nav-label">'+L(k)+'</span></button>').join("");

  return '<div class="student-home-clean">'+

   '<div class="preview-message">'+L("preview")+'</div>'+

 }
 function unitCard(u){
   const locked=u.status==="Locked";
   const status=locked?T("locked"):u.pct===100?T("complete"):u.pct>0?T("inProgress"):T("ready");
   return '<button type="button" class="journey-unit-card '+(locked?"locked":"")+' '+(u.pct===100?"complete":"")+'" data-go="'+(locked?"locked":"practice")+'">'+
    '<div class="journey-unit-top"><span class="journey-unit-num">'+String(u.number).padStart(2,"0")+'</span><span class="journey-status">'+label(status)+'</span></div>'+

    '<div class="journey-unit-foot"><span>'+label(locked?T("teacherOpens"):"2/4 "+T("requiredStages"))+'</span><strong>'+(!locked?u.pct+"%":"")+'</strong></div></button>';
 }

   '<div class="demo-question">'+esc(q.q)+'</div><div class="demo-answers">'+opts+'</div>'+
   '<p class="muted">'+L("chooseAnswer")+'</p>'+feedback+

 }

   '<button class="btn btn-secondary" type="button" data-action="sample-only">'+L("changeLogin")+'</button></div>'+
   '<div class="card student-profile-details"><div><span>'+L("classLabel")+'</span><strong>'+L("studentClass")+'</strong></div><div><span>'+L("schoolLabel")+'</span><strong>'+L("demoSchool")+'</strong></div><div><span>'+L("accountLabel")+'</span><strong>'+L("demoAccount")+'</strong></div></div>'+
   '<div class="card demo-settings"><h2>'+L("languageTitle")+'</h2><p>'+L("languageExplain")+'</p>'+languagePicker()+'</div>'+
   '<div style="max-width:980px;margin:15px auto"><button type="button" class="btn btn-outline student-logout-btn" data-action="sample-only">'+L("logout")+'</button></div>'+
   '<div class="preview-message">'+L("preview")+'</div>';
 }
 function render(){
  document.documentElement.lang=language;
  document.documentElement.dir="ltr"; // Preserve STEP UP geometry; translate UI copy only.
  renderHeader();renderNav();
  $("#demoView").innerHTML=screen==="home"?renderHome():
    screen==="journey"?renderJourney():
    screen==="practice"?renderPractice():
    screen==="progress"?renderProgress():renderAssistant();
  if(screen==="profile")$("#demoView").innerHTML=renderProfile();
 }
 function navigate(to){
  if(to==="locked"){alert(T("teacherOpens"));return;}
  if(!["home","journey","practice","progress","assistant","profile"].includes(to))return;
  screen=to;render();window.scrollTo(0,0);
 }
 document.addEventListener("click",function(e){
  const lng=e.target.closest("[data-language]");
  if(lng){const v=lng.dataset.language;if(v!=="en"&&v!=="ar")return;language=v;try{localStorage.setItem(STORAGE_KEY,v);}catch(_){}render();return;}
  if(e.target.closest("#demoAvatar")){navigate("profile");return;}
  const go=e.target.closest("[data-go]");
  if(go){navigate(go.dataset.go);return;}
  const choice=e.target.closest("[data-choice]");
  if(choice && !confirmed){selected=Number(choice.dataset.choice);render();return;}
  const action=e.target.closest("[data-action]");
  if(!action)return;
  if(action.dataset.action==="sample-only"){alert(T("previewNotAvailable"));return;}
  if(action.dataset.action==="restart"){questionIndex=0;selected=-1;confirmed=false;score=0;completed=false;render();return;}
  if(action.dataset.action==="confirm"){
    if(selected<0){alert(T("chooseAnswer"));return;}
    confirmed=true;if(selected===exercises[questionIndex].answer)score++;render();return;
  }
  if(action.dataset.action==="next"){
    if(questionIndex+1===exercises.length){completed=true;}else{questionIndex++;selected=-1;confirmed=false;}
    render();
  }
 });
 render();
})();
</script>
</body>
</html>
